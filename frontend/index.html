<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Mthokozisi Nene Madlokovo Student Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎓 Student Management System</h1>
        <p>Manage your students efficiently</p>
      </header>

      <div id="alert" class="alert" style="display: none"></div>

      <section class="form-section">
        <h2 id="form-title">Add New Student</h2>
        <div class="form-grid">
          <input
            type="text"
            id="name"
            placeholder="Full Name *"
            maxlength="100"
          />
          <input
            type="email"
            id="email"
            placeholder="Email *"
            maxlength="100"
          />
          <input type="number" id="age" placeholder="Age *" min="1" max="150" />
          <input
            type="text"
            id="course"
            placeholder="Course *"
            maxlength="100"
          />
        </div>
        <div class="button-group">
          <button id="submit-btn" class="btn btn-primary">Add Student</button>
          <button
            id="cancel-btn"
            class="btn btn-secondary"
            style="display: none"
          >
            Cancel
          </button>
        </div>
      </section>

      <section class="search-section">
        <input
          type="text"
          id="search"
          placeholder="🔍 Search students..."
          class="search-box"
        />
      </section>

      <section class="table-section">
        <h2>Student List <span id="count" class="badge">0</span></h2>
        <div class="table-wrapper">
          <table id="students-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Course</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr>
                <td colspan="6" class="loading">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
